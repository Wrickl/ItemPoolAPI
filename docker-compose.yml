services:
  item_pool_mongodb:
    image: mongo:latest
    container_name: item_pool_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PW}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - ${MONGO_PORT}:27017
    volumes:
      - "mongodata:/bitnami/mongodb/:rw"
    restart: unless-stopped
  item_pool_postgresdb:
    image: postgres:18.3
    container_name: item_pool_postgresdb
    environment:
      POSTGRES_PASSWORD: ${MONGO_PW}
      POSTGRES_USER: ${MONGO_USER}
    ports:
      - 8280:5432
    restart: unless-stopped
    volumes:
      - "postgresdata:/var/lib/postgresql/18/docker:rw"
volumes:
  mongodata:
  postgresdata:
