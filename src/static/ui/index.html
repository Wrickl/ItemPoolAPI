<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Item Search & Export</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui/styles.css">
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <div>
          <h1 class="mb-1">Item Suche & Export</h1>
          <p class="text-muted mb-0">Suche Items und exportiere sie als JSON-Datei.</p>
        </div>
        <a class="btn btn-primary" href="/ui/create">Neues Item anlegen</a>
      </div>

      <form id="searchForm" class="row g-3 mb-3">
        <div class="col-md-6">
          <input type="text" id="q" class="form-control" placeholder="Freitextsuche in Fragestellung" />
        </div>
        <div class="col-md-3">
          <input type="text" id="author_name" class="form-control" placeholder="Author Name (optional)" />
        </div>
        <div class="col-md-2">
          <input type="number" id="database_id" class="form-control" placeholder="DB ID (optional)" />
        </div>
        <div class="col-md-1 d-grid">
          <button id="searchBtn" class="btn btn-primary">Suchen</button>
        </div>
      </form>

      <div class="mb-3 d-flex gap-2 flex-wrap align-items-center">
        <button id="exportBtn" class="btn btn-outline-success">Exportiere gefundene Items (JSON)</button>
        <div id="selectionControls" style="display:none;">
          <span class="text-muted me-2">
            <a href="#" id="selectAllLink">Alle markieren</a> /
            <a href="#" id="deselectAllLink">Alle entmarkieren</a>
          </span>
          <button id="downloadSelectedBtn" class="btn btn-primary" disabled>
            Download Selected (<span id="selectedCount">0</span>)
          </button>
        </div>
      </div>

      <div id="results" class="table-responsive">
        <table class="table table-striped" id="resultsTable">
          <thead>
            <tr>
              <th style="width: 40px;"><input type="checkbox" id="selectAllCheckbox" style="display:none;"></th>
              <th>ID</th>
              <th>Fragestellung</th>
              <th>Typ</th>
              <th>Lizenz</th>
              <th>Status</th>
              <th>Autor</th>
              <th>DB</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/ui/app.js"></script>
  </body>
</html>
