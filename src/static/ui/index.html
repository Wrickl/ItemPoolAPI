<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Item Search & Export</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui/styles.css">
  </head>
  <body>
    <div class="container py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
            <div>
                <h1 class="mb-1">Aufgaben durchsuchen</h1>
                <p class="text-muted mb-0">Suche und verwalte deine Aufgaben</p>
            </div>
            <div class="gap-2 d-flex">
                <a class="btn btn-primary" href="/ui/new/items">Neue Aufgabe</a>
                <a class="btn btn-outline-primary" href="/ui/dashboard">Zur Startseite</a>
                <a class="btn btn-secondary" href="/ui/settings">Einstellungen</a>
            </div>
        </div>

      <form id="searchForm" class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="q" id="qLabel" class="visually-hidden">Freitextsuche in Metadaten und Content-Blöcken</label>
          <input type="text" id="q" class="form-control" aria-labelledby="qLabel" placeholder="Freitextsuche in Metadaten und Content-Blöcken" />
        </div>
        <div class="col-md-5">
          <label for="author_name" class="visually-hidden">Author Name</label>
          <input type="text" id="author_name" class="form-control" placeholder="Author Name (optional)" />
        </div>
        <div class="col-md-1 d-grid">
          <button id="searchBtn" class="btn btn-primary">Suchen</button>
        </div>
      </form>

      <div class="mb-3 d-flex gap-2 flex-wrap align-items-center">
        <button id="exportBtn" class="btn btn-outline-success">Exportiere gefundene Items (JSON)</button>
        <div id="selectionControls" style="display:none;">
          <span class="text-muted me-2">
            <a href="#" id="selectAllLink">Alle markieren</a> /
            <a href="#" id="deselectAllLink">Alle entmarkieren</a>
          </span>
          <button id="downloadSelectedBtn" class="btn btn-primary" aria-labelledby="downloadSelectedLabel selectedCount" disabled>
            <span id="downloadSelectedLabel">Download Selected</span> (<span id="selectedCount">0</span>)
          </button>
          <div class="d-inline-flex gap-2 align-items-center ms-2">
            <label for="collectionNameInput" class="visually-hidden">Collection-Name</label>
            <input
              id="collectionNameInput"
              type="text"
              class="form-control form-control-sm"
              placeholder="Collection-Name"
              style="min-width: 220px;"
            />
            <button id="createCollectionBtn" class="btn btn-sm btn-outline-primary" disabled>
              Als Collection speichern
            </button>
          </div>
        </div>
      </div>

      <div id="results" class="table-responsive">
        <table class="table table-striped" id="resultsTable">
          <thead>
            <tr>
              <th style="width: 40px;"><label for="selectAllCheckbox" class="visually-hidden">Alle Treffer auswählen</label><input type="checkbox" id="selectAllCheckbox" style="display:none;"></th>
              <th>ID</th>
              <th>Vorschau</th>
              <th>ItemType</th>
              <th>Lizenz</th>
              <th>Status</th>
              <th>Autor</th>
              <th>Blöcke</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="itemDetailsModal" tabindex="-1" aria-labelledby="itemDetailsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="itemDetailsModalLabel">Item-Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schliessen"></button>
          </div>
          <div class="modal-body" id="itemDetailsBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Schliessen</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
