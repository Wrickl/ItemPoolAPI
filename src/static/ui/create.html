<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Item anlegen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui/styles.css">
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <div>
          <h1 class="mb-1">Item anlegen</h1>
          <p class="text-muted mb-0">Dropdowns werden aus den vorhandenen Creators, Datenbanken und Enums geladen.</p>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="/ui">Zur Suche</a>
        </div>
      </div>

      <div id="messageBox"></div>

      <form id="createItemForm" class="card shadow-sm">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label for="fragestellung" class="form-label">Fragestellung</label>
              <textarea id="fragestellung" class="form-control" rows="4" required placeholder="Die eigentliche Aufgabenstellung"></textarea>
            </div>

            <div class="col-md-6">
              <label for="question_type" class="form-label">Fragetyp</label>
              <select id="question_type" class="form-select" required></select>
            </div>

            <div class="col-md-6">
              <label for="license" class="form-label">Lizenz</label>
              <select id="license" class="form-select" required></select>
            </div>

            <div class="col-md-6">
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-select" required></select>
            </div>

            <div class="col-md-6">
              <label for="author_id" class="form-label">Creator</label>
              <div class="input-group">
                <select id="author_id" class="form-select" required></select>
                <button id="addCreatorBtn" type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#createCreatorModal">Neuen Creator</button>
              </div>
              <div class="form-text">Angezeigt wird der Name, gesendet wird die zugehörige ID im Hintergrund.</div>
            </div>

            <div class="col-md-6">
              <label for="database_id" class="form-label">Datenbank</label>
              <select id="database_id" class="form-select">
                <option value="">Keine Zuordnung</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="solution" class="form-label">Musterlösung</label>
              <input id="solution" class="form-control" type="text" placeholder="Optional">
            </div>

            <div class="col-12">
              <label for="item_metadata" class="form-label">Item-Metadaten (JSON, optional)</label>
              <textarea id="item_metadata" class="form-control font-monospace" rows="6" placeholder='{"difficulty": "medium", "tags": ["SQL"]}'></textarea>
            </div>
          </div>
        </div>

        <div class="card-footer d-flex flex-column flex-sm-row gap-2 justify-content-between align-items-sm-center">
          <span id="formHint" class="text-muted small">Erforderliche Felder werden vor dem Senden geprüft.</span>
          <button type="submit" class="btn btn-primary">Item speichern</button>
        </div>
      </form>
    </div>

    <!-- Create Creator Modal -->
    <div class="modal fade" id="createCreatorModal" tabindex="-1" aria-labelledby="createCreatorModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="createCreatorModalLabel">Neuen Creator anlegen</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
          </div>
          <div class="modal-body">
            <form id="createCreatorForm">
              <div class="mb-3">
                <label for="new_creator_name" class="form-label">Name</label>
                <input id="new_creator_name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="new_creator_email" class="form-label">Email</label>
                <input id="new_creator_email" type="email" class="form-control" />
              </div>
              <div class="mb-3">
                <label for="new_creator_role" class="form-label">Role (int)</label>
                <input id="new_creator_role" type="number" class="form-control" value="0" />
              </div>
              <div class="mb-3">
                <label for="new_creator_organisation" class="form-label">Organisation</label>
                <select id="new_creator_organisation" class="form-select"></select>
              </div>
            </form>
            <div id="createCreatorMessage"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
            <button id="submitCreateCreator" type="button" class="btn btn-primary">Anlegen</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/ui/create.js"></script>
  </body>
</html>
